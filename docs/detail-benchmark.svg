<svg width="760" height="330" viewBox="0 0 760 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="330" rx="20" fill="#F5F7FB"/>
  <text x="32" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1F2329">With vs without Agentic Tool Catalog</text>
  <text x="32" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6B7280">Same tasks · same model · same tool surface · verified independently · 10 runs per arm</text>

  <!-- schema payload -->
  <text x="32" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1F2329">First-request tool-schema payload</text>
  <rect x="290" y="100" width="300" height="14" rx="7" fill="#D8DEE7"/>
  <text x="600" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6B7280">131,390 chars</text>
  <rect x="290" y="120" width="50" height="14" rx="7" fill="#145AF3"/>
  <text x="350" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#145AF3">21,877 chars · −83.3%</text>

  <!-- prompt tokens -->
  <text x="32" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1F2329">First-request prompt tokens (real usage)</text>
  <rect x="290" y="160" width="300" height="14" rx="7" fill="#D8DEE7"/>
  <text x="600" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6B7280">49,504</text>
  <rect x="290" y="180" width="112" height="14" rx="7" fill="#145AF3"/>
  <text x="412" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#145AF3">18,536 · −62.6%</text>

  <!-- total tokens -->
  <text x="32" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1F2329">Total tokens per session</text>
  <rect x="290" y="220" width="300" height="14" rx="7" fill="#D8DEE7"/>
  <text x="600" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6B7280">452,463</text>
  <rect x="290" y="240" width="178" height="14" rx="7" fill="#145AF3"/>
  <text x="478" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#145AF3">268,551 · −40.6%</text>

  <rect x="32" y="280" width="696" height="28" rx="8" fill="#E9EFFB"/>
  <text x="46" y="299" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#33507A">Task success: 100% both arms · cost per session ≈ flat (+3.7%) · one-time background catalog generation not included in these task figures.</text>
